project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - "*.qmd"
    - "analysis-in-r/*.qmd"
    - "math-writeups/*.qmd"
    - "references/*.qmd"

website:
  title: "Longitudinal Data Analysis in R"
  site-url: "https://wenbinwu2001.github.io/oh-my-qualify-application/"
  search: true
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - text: "Topic catalogue"
        href: index.qmd
      - section: "Analysis in R"
        contents:
          - analysis-in-r/00-data-manipulation-tables.qmd
          - analysis-in-r/00-visualization.qmd
          - analysis-in-r/01-eda-descriptive.qmd
          - analysis-in-r/02-rm-anova-manova.qmd
          - analysis-in-r/03-linear-mixed-models.qmd
          - analysis-in-r/04-marginal-models-gee.qmd
          - analysis-in-r/05-glm-review.qmd
          - analysis-in-r/06-glmm.qmd
          - analysis-in-r/07-missing-data.qmd
          - analysis-in-r/08-multivariate-testing-pca.qmd
          - analysis-in-r/09-diagnostics-residual.qmd
      - section: "Accompanying Mathematics"
        contents:
          - math-writeups/00-index.qmd
          - math-writeups/01-foundations-mvn-ml-reml.qmd
          - math-writeups/02-repeated-measures-anova-manova.qmd
          - math-writeups/03-gaussian-marginal-models.qmd
          - math-writeups/04-linear-mixed-models.qmd
          - math-writeups/05-inference-diagnostics.qmd
          - math-writeups/06-generalized-linear-models.qmd
          - math-writeups/07-marginal-models-gee.qmd
          - math-writeups/08-generalized-linear-mixed-multilevel.qmd
          - math-writeups/09-ordinal-nominal-joint-models.qmd
          - math-writeups/10-missing-data.qmd
          - math-writeups/11-transition-models.qmd
          - math-writeups/12-time-varying-covariates.qmd
          - math-writeups/13-sample-size-power.qmd
      - section: "Reference"
        contents:
          - references/roadmap.qmd
          - references/A0-setup-packages-data.qmd
          - references/A1-inference-diagnostics.qmd
          - references/A2-interpretation-cheatsheet.qmd
          - references/A3-packages.qmd

format:
  html:
    toc: true
    number-sections: false
    code-fold: false
    df-print: paged

execute:
  freeze: false
  warning: false
  message: false
