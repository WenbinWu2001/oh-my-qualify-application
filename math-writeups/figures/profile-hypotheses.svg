<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Profile-analysis null hypotheses</title>
  <desc id="desc">Three panels show parallel group profiles, coincident group profiles, and flat group profiles across four measurement occasions.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #222; }
    .panel-title { font-size: 20px; font-weight: 650; }
    .subtitle { font-size: 14px; fill: #555; }
    .axis-label { font-size: 16px; }
    .tick { font-size: 13px; fill: #555; }
    .grid { stroke: #d9dee5; stroke-width: 1; }
    .axis { stroke: #606770; stroke-width: 1.4; }
    .group-a { fill: none; stroke: #0072b2; stroke-width: 3; }
    .group-b { fill: none; stroke: #d55e00; stroke-width: 3; }
    .group-b-dash { fill: none; stroke: #d55e00; stroke-width: 3; stroke-dasharray: 8 6; }
    .point-a { fill: #0072b2; }
    .point-b { fill: #d55e00; }
    .panel { fill: #fff; stroke: #aeb6bf; stroke-width: 1.2; }
  </style>

  <rect x="0" y="0" width="1200" height="430" fill="#fff"/>
  <text x="24" y="225" class="axis-label" text-anchor="middle" transform="rotate(-90 24 225)">Mean response</text>

  <!-- Panel backgrounds -->
  <rect x="58" y="58" width="350" height="292" rx="4" class="panel"/>
  <rect x="425" y="58" width="350" height="292" rx="4" class="panel"/>
  <rect x="792" y="58" width="350" height="292" rx="4" class="panel"/>

  <!-- Titles -->
  <text x="233" y="27" class="panel-title" text-anchor="middle">Parallelism</text>
  <text x="233" y="48" class="subtitle" text-anchor="middle">H₀: no group × occasion interaction</text>
  <text x="600" y="27" class="panel-title" text-anchor="middle">Coincidence</text>
  <text x="600" y="48" class="subtitle" text-anchor="middle">H₀: no group effect</text>
  <text x="967" y="27" class="panel-title" text-anchor="middle">Flatness</text>
  <text x="967" y="48" class="subtitle" text-anchor="middle">H₀: no occasion effect</text>

  <!-- Horizontal grids -->
  <path d="M58 116H408 M58 175H408 M58 233H408 M58 292H408
           M425 116H775 M425 175H775 M425 233H775 M425 292H775
           M792 116H1142 M792 175H1142 M792 233H1142 M792 292H1142" class="grid"/>

  <!-- Axes -->
  <path d="M58 58V350H408 M425 58V350H775 M792 58V350H1142" class="axis" fill="none"/>

  <!-- Occasion ticks -->
  <g class="tick" text-anchor="middle">
    <text x="103" y="371">1</text><text x="190" y="371">2</text><text x="277" y="371">3</text><text x="364" y="371">4</text>
    <text x="470" y="371">1</text><text x="557" y="371">2</text><text x="644" y="371">3</text><text x="731" y="371">4</text>
    <text x="837" y="371">1</text><text x="924" y="371">2</text><text x="1011" y="371">3</text><text x="1098" y="371">4</text>
  </g>

  <!-- Parallel profiles: constant vertical difference -->
  <polyline points="103,245 190,213 277,181 364,149" class="group-a"/>
  <polyline points="103,185 190,153 277,121 364,89" class="group-b"/>
  <g class="point-a"><circle cx="103" cy="245" r="5"/><circle cx="190" cy="213" r="5"/><circle cx="277" cy="181" r="5"/><circle cx="364" cy="149" r="5"/></g>
  <g class="point-b"><circle cx="103" cy="185" r="5"/><circle cx="190" cy="153" r="5"/><circle cx="277" cy="121" r="5"/><circle cx="364" cy="89" r="5"/></g>

  <!-- Coincident profiles: same means at every occasion -->
  <polyline points="470,262 557,218 644,170 731,113" class="group-a"/>
  <polyline points="470,262 557,218 644,170 731,113" class="group-b-dash"/>
  <g class="point-a"><circle cx="470" cy="262" r="6"/><circle cx="557" cy="218" r="6"/><circle cx="644" cy="170" r="6"/><circle cx="731" cy="113" r="6"/></g>
  <g fill="#fff" stroke="#d55e00" stroke-width="2.5"><circle cx="470" cy="262" r="3.5"/><circle cx="557" cy="218" r="3.5"/><circle cx="644" cy="170" r="3.5"/><circle cx="731" cy="113" r="3.5"/></g>

  <!-- Flat profiles: no occasion effect, under parallelism -->
  <polyline points="837,241 924,241 1011,241 1098,241" class="group-a"/>
  <polyline points="837,139 924,139 1011,139 1098,139" class="group-b"/>
  <g class="point-a"><circle cx="837" cy="241" r="5"/><circle cx="924" cy="241" r="5"/><circle cx="1011" cy="241" r="5"/><circle cx="1098" cy="241" r="5"/></g>
  <g class="point-b"><circle cx="837" cy="139" r="5"/><circle cx="924" cy="139" r="5"/><circle cx="1011" cy="139" r="5"/><circle cx="1098" cy="139" r="5"/></g>

  <!-- Shared x label and legend -->
  <text x="600" y="397" class="axis-label" text-anchor="middle">Measurement occasion</text>
  <line x1="445" y1="417" x2="485" y2="417" class="group-a"/><circle cx="465" cy="417" r="4.5" class="point-a"/>
  <text x="494" y="422" class="tick">Group 1</text>
  <line x1="610" y1="417" x2="650" y2="417" class="group-b"/><circle cx="630" cy="417" r="4.5" class="point-b"/>
  <text x="659" y="422" class="tick">Group 2</text>
</svg>
